<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DotDash - looks preview</title>
<style>
@font-face { font-family: "NType82 Headline"; src: url(fonts/NType82-Headline.woff2); }
@font-face { font-family: "NType82 Mono"; src: url(fonts/NType82Mono-Regular.woff2); }
@font-face { font-family: "NDot 55"; src: url(fonts/NDot-55.otf); }
html, body { margin: 0; }
body {
  font: 13px "NType82 Mono", Consolas, monospace; color: #ddd; padding: 18px;
  background: linear-gradient(180deg, #3f78c4 0%, #8fb2d8 40%, #6c7c86 41%, #3d4246 60%, #2c3033 100%);
  min-height: 100vh; box-sizing: border-box;
}
.bar { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.bar b { font-weight: 400; color: #fff; margin-right: 6px; }
.seg { display: inline-flex; background: #000; border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { font: inherit; background: none; color: #aaa; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.seg button.on { background: #fff; color: #000; }
#grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.w { position: relative; }
.w canvas { width: 100%; height: 100%; display: block; }
.w span { position: absolute; left: 4px; top: -15px; font-size: 10px; color: #000; }
</style>
</head>
<body>
<div class="bar">
  <span><b>Digits</b><span class="seg" id="digits"><button data-v="ntype">NType Mono</button><button data-v="ntypehead">NType Headline</button><button data-v="dot">NDot</button><button data-v="grid">Grid</button><button data-v="block">Block</button><button data-v="led">LED</button><button data-v="wide">Wide</button></span></span>
  <span><b>Rev gauges</b><span class="seg" id="gauge"><button data-v="line">Line</button><button data-v="dots">Dots</button></span></span>
  <span><b>Car</b><span class="seg" id="mode"><button data-v="track">Track</button><button data-v="launch">Launch</button><button data-v="idle">Idle</button></span></span>
</div>
<div id="grid"></div>

<script src="src/numfont.js"></script>
<script src="src/streams.js"></script>
<script src="src/widgets.js"></script>
<script src="src/dash.js"></script>
<script>
const LAYOUT = [["DotDash", DotDash, 560, 215], ["DotTacho", DotTacho, 300, 300], ["DotRpm", DotRpm, 460, 56],
  ["DotGearRing", DotGearRing, 130, 130], ["DotBoost", DotBoost, 190, 190], ["DotTimer", DotTimer, 260, 120],
  ["DotInfo", DotInfo, 260, 120], ["DotPedalsClear", DotPedalsClear, 200, 190]];
const widgets = LAYOUT.map(([name, Cls, w, h]) => {
  const box = document.createElement("div");
  box.className = "w"; box.style.width = w + "px"; box.style.height = h + "px";
  box.innerHTML = `<span>${name}</span><canvas></canvas>`;
  document.getElementById("grid").appendChild(box);
  return new Cls(box.querySelector("canvas"));
});
document.fonts && document.fonts.ready.then(() => widgets.forEach((w) => w.resize()));

function seg(id, initial, onPick) {
  const el = document.getElementById(id);
  const pick = (v) => { [...el.children].forEach((b) => b.classList.toggle("on", b.dataset.v === v)); onPick(v); };
  el.onclick = (e) => e.target.dataset.v && pick(e.target.dataset.v);
  pick(initial);
}
seg("digits", "ntype", (v) => { DOT_STYLE.digits = v; });
seg("gauge", "line", (v) => { DOT_STYLE.gauge = v; });

// a crude car: six gears, an engine between idle and the limiter, a scripted driver
const RATIOS = [3.6, 2.2, 1.55, 1.2, 0.98, 0.82], FINAL = 3.7, WHEEL_R = 0.33, MAX = 7600, IDLE = 850;
let mode = "track", v = 0, gear = 1, t = 0, rpm = IDLE, water = 70, oil = 70, fuel = 0.64, lastShift = -1, boost = 0;
seg("mode", "track", (m) => { mode = m; if (m === "launch") { v = 0; gear = 1; t = 0; lastShift = -1; } });

function step(dt) {
  t += dt;
  let thr = 0, brk = 0, steer = 0;
  if (mode === "launch") { thr = t > 1.2 ? 1 : 0; }
  else if (mode === "track") {
    const ph = t % 14;
    if (ph < 6) thr = 1; else if (ph < 7.6) brk = 0.85;
    else if (ph < 11) { thr = 0.45; steer = Math.sin((ph - 7.6) / 3.4 * Math.PI); } else thr = 0.8;
  }
  const wheelRpm = v / (2 * Math.PI * WHEEL_R) * 60;
  let engine = Math.max(IDLE, wheelRpm * RATIOS[gear - 1] * FINAL);
  if (engine > MAX * 0.97 && gear < 6 && t - lastShift > 0.4) { gear++; lastShift = t; }
  if (engine < MAX * 0.42 && gear > 1 && t - lastShift > 0.6) { gear--; lastShift = t; }
  engine = Math.max(IDLE, wheelRpm * RATIOS[gear - 1] * FINAL);
  const shifting = t - lastShift < 0.18;
  const push = shifting ? 0 : thr * 9.5 * RATIOS[gear - 1] / 3.6 * (engine < MAX ? 1 : 0);
  const a = push - brk * 11 - 0.0006 * v * v - 0.25;
  v = Math.max(0, v + a * dt);
  rpm += ((thr > 0 && v < 0.5 ? IDLE + thr * 4000 : engine) - rpm) * Math.min(1, dt * 18);
  boost += ((thr > 0.5 ? (rpm / MAX) * 170 : -55) - boost) * Math.min(1, dt * 3);
  water += ((70 + 22 * Math.min(1, t / 40)) - water) * dt * 0.05;
  oil += ((72 + 32 * Math.min(1, t / 60)) - oil) * dt * 0.04;
  const d = { speed: v, rpm, maxRpm: MAX, gear: v < 0.3 && thr === 0 ? "N" : String(gear), throttle: thr, brake: brk,
    clutch: shifting ? 1 : 0, parkingbrake: mode === "idle" ? 1 : 0, gx: steer * Math.min(1.3, v * v / 600), gy: a / 9.81,
    water, oil, waterText: Math.round(water) + "°", oilText: Math.round(oil) + "°", fuel,
    gearbox: "manual", gearIndex: gear, gearsF: 6, boostKpa: boost, maxBoostKpa: 160 };
  widgets.forEach((w) => w.update(d));
}
let last = performance.now();
(function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt); requestAnimationFrame(loop); })(last);
</script>
</body>
</html>
